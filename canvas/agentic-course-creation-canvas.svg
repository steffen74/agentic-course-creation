<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1188 840" font-family="Helvetica, Arial, sans-serif">
<title>Agentic Course Creation Canvas</title>
<desc>template-sha256:db2061aa9897</desc>
<rect x="0" y="0" width="1188" height="840" fill="#FFFFFF"/>
<text x="30" y="58" font-size="26" font-weight="700" fill="#2C2C2A">Agentic Course Creation Canvas</text>
<text x="30" y="82" font-size="13" fill="#5F5E5A">The agent walks the learner’s path, the instructor decides, checks come before release.</text>
<text x="640" y="50" font-size="11" fill="#5F5E5A">Course</text><line x1="640" y1="78" x2="783" y2="78" stroke="#B4B2A9" stroke-width="1"/>
<text x="813" y="50" font-size="11" fill="#5F5E5A">Instructors</text><line x1="813" y1="78" x2="955" y2="78" stroke="#B4B2A9" stroke-width="1"/>
<text x="985" y="50" font-size="11" fill="#5F5E5A">Run</text><line x1="985" y1="78" x2="1128" y2="78" stroke="#B4B2A9" stroke-width="1"/>
<text x="30" y="112" font-size="15" font-weight="700" fill="#2C2C2A">Purpose</text>
<rect x="30" y="125" width="364" height="133" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="44" y="151" font-size="17" font-weight="700" fill="#3C3489">1  Change</text>
<rect x="254" y="136" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="319.0" y="150" font-size="11" text-anchor="middle" fill="#3C3489">instructor decides</text>
<text x="44" y="173" font-size="11.5" fill="#534AB7">What can learners do afterwards,</text>
<text x="44" y="189" font-size="11.5" fill="#534AB7">in which real situation?</text>
<rect x="30" y="270" width="364" height="133" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="44" y="296" font-size="17" font-weight="700" fill="#3C3489">2  Learners</text>
<rect x="254" y="281" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="319.0" y="295" font-size="11" text-anchor="middle" fill="#3C3489">instructor decides</text>
<text x="44" y="318" font-size="11.5" fill="#534AB7">Background, goals, time, equipment</text>
<text x="44" y="334" font-size="11.5" fill="#534AB7">Who is the weakest learner we serve?</text>
<rect x="30" y="416" width="364" height="133" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="44" y="442" font-size="17" font-weight="700" fill="#3C3489">3  Learning goals</text>
<rect x="254" y="426" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="319.0" y="440" font-size="11" text-anchor="middle" fill="#3C3489">instructor decides</text>
<text x="44" y="464" font-size="11.5" fill="#534AB7">Observable: “can …”</text>
<text x="44" y="480" font-size="11.5" fill="#534AB7">What the course does not cover</text>
<rect x="30" y="561" width="364" height="133" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="44" y="587" font-size="17" font-weight="700" fill="#3C3489">4  Evidence</text>
<rect x="254" y="572" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="319.0" y="586" font-size="11" text-anchor="middle" fill="#3C3489">instructor decides</text>
<text x="44" y="609" font-size="11.5" fill="#534AB7">Which deliverable shows each goal?</text>
<text x="44" y="625" font-size="11.5" fill="#534AB7">Criteria, certificate</text>
<text x="412" y="112" font-size="15" font-weight="700" fill="#2C2C2A">Design</text>
<rect x="412" y="125" width="364" height="133" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="426" y="151" font-size="17" font-weight="700" fill="#085041">5  Constraints</text>
<rect x="672" y="136" width="94" height="20" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/><text x="719.0" y="150" font-size="11" text-anchor="middle" fill="#085041">agent drafts</text>
<text x="426" y="173" font-size="11.5" fill="#0F6E56">Sessions, workload budget, dates</text>
<text x="426" y="189" font-size="11.5" fill="#0F6E56">Platforms, tool costs, licenses</text>
<rect x="412" y="270" width="364" height="133" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="426" y="296" font-size="17" font-weight="700" fill="#3C3489">6  Assumed knowledge</text>
<rect x="636" y="281" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="701.0" y="295" font-size="11" text-anchor="middle" fill="#3C3489">instructor decides</text>
<text x="426" y="318" font-size="11.5" fill="#534AB7">What learners know, have and have done</text>
<text x="426" y="334" font-size="11.5" fill="#534AB7">Everything else: taught before it is used</text>
<rect x="412" y="416" width="364" height="133" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="426" y="442" font-size="17" font-weight="700" fill="#3C3489">7  Design decisions</text>
<rect x="636" y="426" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="701.0" y="440" font-size="11" text-anchor="middle" fill="#3C3489">instructor decides</text>
<text x="426" y="464" font-size="11.5" fill="#534AB7">Sequence, project, format, tools</text>
<text x="426" y="480" font-size="11.5" fill="#534AB7">Source of truth for each fact</text>
<rect x="412" y="561" width="364" height="133" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="426" y="587" font-size="17" font-weight="700" fill="#085041">8  Checks</text>
<rect x="672" y="572" width="94" height="20" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/><text x="719.0" y="586" font-size="11" text-anchor="middle" fill="#085041">agent drafts</text>
<text x="426" y="609" font-size="11.5" fill="#0F6E56">Alignment, boundary, workload, links</text>
<text x="426" y="625" font-size="11.5" fill="#0F6E56">Consistency, nothing private made public</text>
<text x="794" y="112" font-size="15" font-weight="700" fill="#2C2C2A">Build and improve</text>
<rect x="794" y="125" width="364" height="133" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="808" y="151" font-size="17" font-weight="700" fill="#085041">9  Resources</text>
<rect x="1054" y="136" width="94" height="20" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/><text x="1101.0" y="150" font-size="11" text-anchor="middle" fill="#085041">agent drafts</text>
<text x="808" y="173" font-size="11.5" fill="#0F6E56">Per unit: instructor, participant, code</text>
<text x="808" y="189" font-size="11.5" fill="#0F6E56">Draft · checked · released</text>
<rect x="794" y="270" width="364" height="133" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="808" y="296" font-size="17" font-weight="700" fill="#085041">10  Learner signals</text>
<rect x="1054" y="281" width="94" height="20" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/><text x="1101.0" y="295" font-size="11" text-anchor="middle" fill="#085041">agent drafts</text>
<text x="808" y="318" font-size="11.5" fill="#0F6E56">Walkthroughs per persona before release</text>
<text x="808" y="334" font-size="11.5" fill="#0F6E56">Questions, quizzes, gaps after</text>
<rect x="794" y="416" width="364" height="278" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="808" y="442" font-size="17" font-weight="700" fill="#3C3489">11  Improvements</text>
<rect x="1018" y="426" width="130" height="20" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="1083.0" y="440" font-size="11" text-anchor="middle" fill="#3C3489">instructor decides</text>
<text x="808" y="464" font-size="11.5" fill="#534AB7">What changes now, what next run</text>
<text x="808" y="480" font-size="11.5" fill="#534AB7">Which signal became a check or rule</text>
<rect x="30" y="710" width="555" height="80" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="44" y="734" font-size="15" font-weight="700" fill="#444441">Open questions</text><text x="44" y="752" font-size="11.5" fill="#5F5E5A">Who resolves it, by when?</text>
<rect x="603" y="710" width="555" height="80" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="617" y="734" font-size="15" font-weight="700" fill="#444441">Decision log</text><text x="617" y="752" font-size="11.5" fill="#5F5E5A">Date · decision · reason · alternatives</text>
<rect x="30" y="802" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="50" y="813" font-size="11.5" fill="#2C2C2A">Instructor decides</text><rect x="203" y="802" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="223" y="813" font-size="11.5" fill="#2C2C2A">Agent drafts, instructor approves</text>
<text x="1158" y="813" font-size="10.5" text-anchor="end" fill="#5F5E5A">Agentic Course Creation Canvas v0.2 · CC BY 4.0 · github.com/steffen74/agentic-course-creation</text>
</svg>
